<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Local Governance - Admin</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <div class="logo-circle">
                ALG
            </div>

            <h1>AI Local Governance</h1>

            <p class="admin-title">Administrator Portal</p>

            <p class="description">
                Manage citizen grievances and local governance services.
            </p>

            <form id="loginForm">

                <label for="email">Admin Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter admin email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

                <button type="submit">
                    Sign In
                </button>

                <p id="message"></p>

            </form>

            <div class="footer-text">
                AI Local Governance Assistant
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
